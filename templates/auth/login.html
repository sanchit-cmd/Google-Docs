<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sign In - Docs Collab</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <style>
      body {
        font-family: "Inter", sans-serif;
      }
    </style>
  </head>
  <body class="bg-[#f0f4f9] min-h-screen flex items-center justify-center p-4">
    <div class="w-full max-w-md bg-white rounded-2xl shadow-xl border border-gray-100 p-8">
      
      <!-- Brand Header -->
      <div class="text-center mb-8">
        <div class="inline-flex items-center justify-center w-14 h-14 bg-blue-600 text-white text-2xl font-bold rounded-2xl shadow-md mb-3">
          ≡
        </div>
        <h1 class="text-2xl font-bold text-gray-900 tracking-tight">Docs Collab</h1>
        <p class="text-sm text-gray-500 mt-1" id="subheading-text">Sign in to collaborate in real-time</p>
      </div>

      <!-- Tab Switcher -->
      <div class="flex bg-gray-100 p-1 rounded-xl mb-6 font-medium text-sm">
        <button
          type="button"
          id="tab-login"
          onclick="switchTab('login')"
          class="flex-1 py-2.5 rounded-lg text-blue-600 bg-white shadow-sm transition-all text-center"
        >
          Sign In
        </button>
        <button
          type="button"
          id="tab-register"
          onclick="switchTab('register')"
          class="flex-1 py-2.5 rounded-lg text-gray-600 hover:text-gray-900 transition-all text-center"
        >
          Create Account
        </button>
      </div>

      <!-- Alert Banner -->
      <div
        id="error-alert"
        class="hidden mb-5 p-3.5 rounded-xl bg-red-50 border border-red-200 text-red-700 text-sm flex items-start gap-2.5"
      >
        <svg class="w-5 h-5 flex-shrink-0 mt-0.5 text-red-500" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4m0 4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z" />
        </svg>
        <span id="error-message"></span>
      </div>

      <div
        id="success-alert"
        class="hidden mb-5 p-3.5 rounded-xl bg-green-50 border border-green-200 text-green-700 text-sm flex items-start gap-2.5"
      >
        <svg class="w-5 h-5 flex-shrink-0 mt-0.5 text-green-500" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7" />
        </svg>
        <span id="success-message"></span>
      </div>

      <!-- LOGIN FORM -->
      <form id="login-form" onsubmit="handleLogin(event)" class="space-y-4">
        <div>
          <label class="block text-xs font-semibold text-gray-700 uppercase tracking-wider mb-1.5" for="login-username">Username</label>
          <input
            type="text"
            id="login-username"
            name="username"
            required
            autocomplete="username"
            placeholder="e.g. alexsmith"
            class="w-full px-4 py-2.5 border border-gray-300 rounded-xl focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none text-sm transition"
          />
        </div>

        <div>
          <label class="block text-xs font-semibold text-gray-700 uppercase tracking-wider mb-1.5" for="login-password">Password</label>
          <input
            type="password"
            id="login-password"
            name="password"
            required
            autocomplete="current-password"
            placeholder="••••••••"
            class="w-full px-4 py-2.5 border border-gray-300 rounded-xl focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none text-sm transition"
          />
        </div>

        <button
          type="submit"
          id="login-btn"
          class="w-full py-3 px-4 bg-blue-600 hover:bg-blue-700 active:bg-blue-800 text-white font-medium rounded-xl shadow-md transition-all flex items-center justify-center gap-2 text-sm mt-2"
        >
          <span id="login-btn-text">Sign In</span>
          <svg id="login-spinner" class="hidden animate-spin h-4 w-4 text-white" fill="none" viewBox="0 0 24 24">
            <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
            <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8v8H4z"></path>
          </svg>
        </button>
      </form>

      <!-- REGISTER FORM -->
      <form id="register-form" onsubmit="handleRegister(event)" class="space-y-4 hidden">
        <div>
          <label class="block text-xs font-semibold text-gray-700 uppercase tracking-wider mb-1.5" for="reg-name">Full Name</label>
          <input
            type="text"
            id="reg-name"
            name="name"
            required
            placeholder="e.g. Alex Smith"
            class="w-full px-4 py-2.5 border border-gray-300 rounded-xl focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none text-sm transition"
          />
        </div>

        <div>
          <label class="block text-xs font-semibold text-gray-700 uppercase tracking-wider mb-1.5" for="reg-username">Username</label>
          <input
            type="text"
            id="reg-username"
            name="username"
            required
            placeholder="e.g. alexsmith"
            class="w-full px-4 py-2.5 border border-gray-300 rounded-xl focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none text-sm transition"
          />
        </div>

        <div>
          <label class="block text-xs font-semibold text-gray-700 uppercase tracking-wider mb-1.5" for="reg-password">Password (min 6 characters)</label>
          <input
            type="password"
            id="reg-password"
            name="password"
            required
            minlength="6"
            placeholder="••••••••"
            class="w-full px-4 py-2.5 border border-gray-300 rounded-xl focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none text-sm transition"
          />
        </div>

        <button
          type="submit"
          id="reg-btn"
          class="w-full py-3 px-4 bg-blue-600 hover:bg-blue-700 active:bg-blue-800 text-white font-medium rounded-xl shadow-md transition-all flex items-center justify-center gap-2 text-sm mt-2"
        >
          <span id="reg-btn-text">Create Account</span>
          <svg id="reg-spinner" class="hidden animate-spin h-4 w-4 text-white" fill="none" viewBox="0 0 24 24">
            <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
            <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8v8H4z"></path>
          </svg>
        </button>
      </form>

      <!-- Footer Info -->
      <div class="mt-8 pt-6 border-t border-gray-100 text-center text-xs text-gray-400">
        Secured with JWT & Real-time Collaboration Engine
      </div>
    </div>

    <script>
      function showError(msg) {
        const errorAlert = document.getElementById("error-alert");
        const errorMessage = document.getElementById("error-message");
        const successAlert = document.getElementById("success-alert");
        successAlert.classList.add("hidden");
        errorMessage.textContent = msg;
        errorAlert.classList.remove("hidden");
      }

      function showSuccess(msg) {
        const errorAlert = document.getElementById("error-alert");
        const successAlert = document.getElementById("success-alert");
        const successMessage = document.getElementById("success-message");
        errorAlert.classList.add("hidden");
        successMessage.textContent = msg;
        successAlert.classList.remove("hidden");
      }

      function hideAlerts() {
        document.getElementById("error-alert").classList.add("hidden");
        document.getElementById("success-alert").classList.add("hidden");
      }

      function switchTab(tab) {
        hideAlerts();
        const loginForm = document.getElementById("login-form");
        const regForm = document.getElementById("register-form");
        const tabLogin = document.getElementById("tab-login");
        const tabReg = document.getElementById("tab-register");
        const subheading = document.getElementById("subheading-text");

        if (tab === "login") {
          loginForm.classList.remove("hidden");
          regForm.classList.add("hidden");
          tabLogin.className = "flex-1 py-2.5 rounded-lg text-blue-600 bg-white shadow-sm transition-all text-center";
          tabReg.className = "flex-1 py-2.5 rounded-lg text-gray-600 hover:text-gray-900 transition-all text-center";
          subheading.textContent = "Sign in to collaborate in real-time";
        } else {
          loginForm.classList.add("hidden");
          regForm.classList.remove("hidden");
          tabReg.className = "flex-1 py-2.5 rounded-lg text-blue-600 bg-white shadow-sm transition-all text-center";
          tabLogin.className = "flex-1 py-2.5 rounded-lg text-gray-600 hover:text-gray-900 transition-all text-center";
          subheading.textContent = "Create an account to start writing";
        }
      }

      async function handleLogin(event) {
        event.preventDefault();
        hideAlerts();

        const btn = document.getElementById("login-btn");
        const spinner = document.getElementById("login-spinner");
        const btnText = document.getElementById("login-btn-text");

        const username = document.getElementById("login-username").value.trim();
        const password = document.getElementById("login-password").value;

        btn.disabled = true;
        spinner.classList.remove("hidden");
        btnText.textContent = "Signing In...";

        try {
          const response = await fetch("/auth/login", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ username, password }),
          });

          const data = await response.json();

          if (!response.ok) {
            throw new Error(data.detail || "Invalid username or password");
          }

          showSuccess("Login successful! Redirecting...");
          // Redirect to /editor
          window.location.href = data.redirect_url || "/editor";
        } catch (err) {
          showError(err.message);
          btn.disabled = false;
          spinner.classList.add("hidden");
          btnText.textContent = "Sign In";
        }
      }

      async function handleRegister(event) {
        event.preventDefault();
        hideAlerts();

        const btn = document.getElementById("reg-btn");
        const spinner = document.getElementById("reg-spinner");
        const btnText = document.getElementById("reg-btn-text");

        const name = document.getElementById("reg-name").value.trim();
        const username = document.getElementById("reg-username").value.trim();
        const password = document.getElementById("reg-password").value;

        btn.disabled = true;
        spinner.classList.remove("hidden");
        btnText.textContent = "Creating Account...";

        try {
          const response = await fetch("/auth/register", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ name, username, password }),
          });

          const data = await response.json();

          if (!response.ok) {
            let errorMsg = data.detail;
            if (Array.isArray(errorMsg)) {
              errorMsg = errorMsg.map((e) => e.msg).join(", ");
            }
            throw new Error(errorMsg || "Registration failed");
          }

          showSuccess("Account created! Redirecting...");
          window.location.href = data.redirect_url || "/editor";
        } catch (err) {
          showError(err.message);
          btn.disabled = false;
          spinner.classList.add("hidden");
          btnText.textContent = "Create Account";
        }
      }
    </script>
  </body>
</html>
